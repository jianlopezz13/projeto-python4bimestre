
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partida</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f0f2f5;
      padding: 20px;
    }

    .quiz {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 12px #0002;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    h2 {
      margin-bottom: 1rem;
      color: #333;
    }

    .info {
      margin-bottom: 1.5rem;
      color: #555;
    }

    .pergunta {
      margin-bottom: 1.5rem;
      font-size: 1.1rem;
      color: #333;
    }

    .opcao {
      width: 100%;
      padding: 0.8rem;
      margin-bottom: 0.7rem;
      background: white;
      border: 1px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }

    .opcao:hover {
      background: #eee;
    }

    .selecionada {
      background: #ddd;
      border: 2px solid #110f0f;
    }

    .btn {
      width: 100%;
      padding: 0.8rem;
      margin-top: 1rem;
      background: #110f0f;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }

  </style>
</head>

<body>

  <div class="quiz">
    <h2>partida</h2>

    <div class="info">
      <p id="numero">Pergunta 1 de 5</p>
      <p id="pontos">Pontos: 0</p>
    </div>

    <div class="pergunta" id="pergunta"></div>

    <div id="opcoes"></div>

    <button class="btn" onclick="responder()">confirmar</button>

    <button class="btn" onclick="voltar()">sair da partida</button>
  </div>

  <script>
    const perguntas = [
      {
        pergunta: "Quanto é 2 + 2?",
        opcoes: ["3", "4", "5", "6"],
        resposta: "4"
      },
      {
        pergunta: "Qual é a capital do Brasil?",
        opcoes: ["São Paulo", "Rio de Janeiro", "Brasília", "Salvador"],
        resposta: "Brasília"
      },
      {
        pergunta: "Quantos dias tem uma semana?",
        opcoes: ["5", "6", "7", "8"],
        resposta: "7"
      },
      {
        pergunta: "Qual é o maior planeta do sistema solar?",
        opcoes: ["Terra", "Marte", "Júpiter", "Vênus"],
        resposta: "Júpiter"
      },
      {
        pergunta: "Qual é a cor da mistura de azul e amarelo?",
        opcoes: ["Verde", "Roxo", "Vermelho", "Rosa"],
        resposta: "Verde"
      }
    ];

    let atual = 0;
    let pontos = 0;
    let escolha = "";

    function mostrar() {
      escolha = "";

      document.getElementById("numero").innerText =
        "Pergunta " + (atual + 1) + " de " + perguntas.length;

      document.getElementById("pontos").innerText =
        "Pontos: " + pontos;

      document.getElementById("pergunta").innerText =
        perguntas[atual].pergunta;

      let html = "";

      perguntas[atual].opcoes.forEach(opcao => {
        html += `<button class="opcao" onclick="selecionar(this, '${opcao}')">${opcao}</button>`;
      });

      document.getElementById("opcoes").innerHTML = html;
    }

    function selecionar(botao, opcao) {
      escolha = opcao;

      document.querySelectorAll(".opcao").forEach(b => {
        b.classList.remove("selecionada");
      });

      botao.classList.add("selecionada");
    }

    function responder() {
      if (escolha === "") {
        alert("Escolha uma resposta!");
        return;
      }

      if (escolha === perguntas[atual].resposta) {
        pontos++;
      }

      atual++;

      if (atual < perguntas.length) {
        mostrar();
      } else {
        resultado();
      }
    }

    function resultado() {
      document.querySelector(".quiz").innerHTML = `
        <h2>fim de partida!</h2>
        <p>Você acertou ${pontos} de ${perguntas.length} perguntas.</p>
        <button class="btn" onclick="location.reload()">jogar novamente</button>
        <button class="btn" onclick="voltar()">voltar ao menu</button>
      `;
    }

    function voltar() {
      window.location.href = "menu.html";
    }

    mostrar();
  </script>

</body>
</html>
