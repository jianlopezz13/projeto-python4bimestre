
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f0f2f5;
    }

    .login {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 12px #0002;
      width: 100%;
      max-width: 360px;
    }

    h2 {
      text-align: center;
      margin-bottom: 1.5rem;
      color: #333;
    }

    .campo {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      margin-bottom: 0.4rem;
      color: #555;
    }

    input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1rem;
    }

    .btn {
      width: 100%;
      padding: 0.75rem;
      margin-top: 0.5rem;
      background: #110f0f;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }

    .btn:hover {
      background: #0052cc;
    }

    .cadastro {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.9rem;
    }

    .cadastro a {
      color: #0066ff;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="login">
    <h2>entra</h2>

    <form onsubmit="login(event)">
      <div class="campo">
        <label for="email">email</label>
        <input type="email" id="email" placeholder="nome@email.com" required>
      </div>

      <div class="campo">
        <label for="senha">senha</label>
        <input type="password" id="senha" placeholder="senha" required>
      </div>

      <button type="submit" class="btn">entrar</button>
    </form>

    <div class="cadastro">
      <p>Não tem conta? <a href="#" onclick="abrirCadastro()">cadastre-se</a></p>
    </div>
  </div>

  <script>
    function abrirCadastro() {
      window.location.href = "cadastro.html";
    }

    function login(event) {
      event.preventDefault();

      let email = document.getElementById("email").value;
      let senha = document.getElementById("senha").value;

      let usuario = JSON.parse(localStorage.getItem(email));

      if (usuario && usuario.senha === senha) {
        window.location.href = "menu.html";
      } else {
        alert("Email ou senha incorretos!");
      }
    }
  </script>

</body>
</html>
